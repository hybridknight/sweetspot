name: Release Desktop App

on:
  # Manual runs validate packaging and retain artifacts without publishing.
  workflow_dispatch:
  push:
    tags:
      - "v*"

# One release per tag; do not cancel mid-publish (assets would be partial).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read # Native media dependencies on GitHub Packages

env:
  NODE_VERSION: "24.14.0"
  COMPILE_ARTIFACT: electron-compile

jobs:
  release-state:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Preserve already published releases
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'push' && context.ref.startsWith('refs/tags/')) {
              const tag = context.ref.slice('refs/tags/'.length);
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                if (!data.draft) {
                  core.notice(`${tag} is already published; its downloads will not be changed.`);
                  core.setOutput('build', 'false');
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.setOutput('build', 'true');

  # Shared electron-vite build (sidecar builds world0).
  # Pack jobs download this artifact and run electron-builder only (no vite).
  compile:
    needs: release-state
    if: needs.release-state.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.value }}
      version_ok: ${{ steps.getVersion.outputs.ok }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            const isRC = id.includes('-rc.')
            core.setOutput("value", id);
            core.setOutput("ok", String(isVersion.test(id)))
            core.setOutput("releaseType", isRC ? 'rc' : 'stable')

      # outputs.ok is the string "true"/"false" — bare `if: outputs.ok` is truthy for "false".
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ steps.getVersion.outputs.value }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/sweetspot/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: Install dependencies
        run: node scripts/install-dependencies.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Electron app
        run: pnpm release:compile
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_APP_GIT_HASH: ${{ github.sha }}

      - name: Verify compile output
        shell: bash
        run: |
          test -f apps/sweetspot/out/main/index.js
          test -f apps/sweetspot/src/preload/generated/sweetspot-world0-host.js

      # Upload the compiled app output; the world0 host is bundled into preload.
      - name: Upload compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: |
            apps/sweetspot/out
          if-no-files-found: error
          retention-days: 3

      # Avoid parallel pack jobs racing on release create.
      - name: Ensure draft GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          title="v${{ steps.getVersion.outputs.value }} - "
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "$title" --notes "Publishing assets…"
          fi

  build-windows:
    needs: compile
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.compile.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/sweetspot/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: install windows deps
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348

      # windows-2025-vs2026 ships VS 2026 (18.x). node-gyp <12.1 cannot detect it
      # (@electron/rebuild used to pull node-gyp@11 → install-app-deps fails on @parcel/watcher).
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: node scripts/install-dependencies.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_msvs_version: "2026"

      # Artifact root contains the compiled app output.
      - name: Download compile artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/sweetspot/out

      - name: Verify compile output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "apps/sweetspot/out/main/index.js")) {
            throw "missing apps/sweetspot/out/main/index.js"
          }

      - name: Pack Windows release
        run: pnpm release:pack:win --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            apps/sweetspot/dist/*.exe
            apps/sweetspot/dist/*.blockmap
            apps/sweetspot/dist/latest.yml
          if-no-files-found: error
          retention-days: 3

  build-macos:
    needs: compile
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.compile.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/sweetspot/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: Install dependencies
        run: node scripts/install-dependencies.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compile artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/sweetspot/out

      - name: Verify compile output
        shell: bash
        run: |
          test -f apps/sweetspot/out/main/index.js

      # Outside Mac App Store: Developer ID Application + notarize
      # Secrets: MACOS_DEVELOPER_ID_APPLICATION_P12 (+ _PASSWORD),
      #          APPLE_NOTARY_API_KEY_P8, APPLE_NOTARY_API_KEY_ID, APPLE_NOTARY_API_ISSUER_ID
      #
      # Do not pass CSC_LINK. electron-builder 26.x calls
      # `security set-key-partition-list -k` with the .p12 password instead of the
      # temp keychain password (electron-userland/electron-builder#10066). That
      # fails on some macos-latest images (SecKeychainUnlock: passphrase not
      # correct) and succeeds on others where securityd is more lenient.
      - name: Select macOS signing mode
        id: signing
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          if [[ -n "$CERTIFICATE" && -n "$CERTIFICATE_PASSWORD" && -n "$NOTARY_KEY" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER" ]]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CERTIFICATE$CERTIFICATE_PASSWORD$NOTARY_KEY$NOTARY_KEY_ID$NOTARY_ISSUER" ]]; then
            echo "::error::Signing is partially configured. Provide all five Developer ID and notarization secrets."
            exit 1
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing credentials configured: macOS packages will be ad-hoc signed and not notarized."
            echo "macOS packages are ad-hoc signed and not notarized. Configure Developer ID and notarization secrets for trusted distribution." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}

      - name: Verify codesigning identity
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          security find-identity -v -p codesigning | grep -F "Developer ID Application"

      - name: Prepare Apple notarization key
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          mkdir -p .secrets
          printf '%s' "$NOTARY_KEY" > .secrets/AuthKey.p8
          chmod 600 .secrets/AuthKey.p8

      - name: Pack macOS release
        if: steps.signing.outputs.mode == 'developer-id'
        run: pnpm release:pack:mac --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_API_KEY: ${{ format('{0}/.secrets/AuthKey.p8', github.workspace) }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

      - name: Pack ad-hoc macOS release
        if: steps.signing.outputs.mode == 'ad-hoc'
        run: pnpm release:pack:mac --publish ${{ github.event_name == 'push' && 'always' || 'never' }} -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          path: |
            apps/sweetspot/dist/*.dmg
            apps/sweetspot/dist/*.zip
            apps/sweetspot/dist/*.blockmap
            apps/sweetspot/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

      - if: always()
        name: Cleanup Apple secrets
        run: rm -rf .secrets

  finalize-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "Tag=$tag Version=$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=""
          if prev=$(gh release list --exclude-drafts --limit 20 --json tagName --jq ".[] | select(.tagName != \"$tag\") | .tagName" | head -n1); then
            :
          else
            prev=""
          fi

          if [ -z "$prev" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi

          if [ -z "$prev" ]; then
            echo "No previous published release — listing all commits reachable from $tag"
            git log --pretty=tformat:"- %s (%h)" "$tag" > release-notes-commits.txt || true
          else
            echo "Commits: $prev..$tag"
            git log --pretty=tformat:"- %s (%h)" "$prev..$tag" > release-notes-commits.txt || true
          fi

          if [ ! -s release-notes-commits.txt ]; then
            echo "- No commits listed for this range." > release-notes-commits.txt
          fi

          {
            echo "## Changes"
            echo
            cat release-notes-commits.txt
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          gh release edit "$tag" \
            --draft \
            --title "v$version - " \
            --notes-file release-notes.md
