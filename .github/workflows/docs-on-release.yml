name: Refresh optional Pages deployment on release

# Vercel hosts production. Only refresh Pages when explicitly enabled.
# Dispatch on the default branch because the Pages environment rejects tag refs.
on:
  release:
    types: [published]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs deploy on default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
