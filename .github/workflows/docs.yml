name: Validate docs

on:
  # Vercel hosts production. Validate static exports without requiring Pages.
  # Optional Pages deployments must use a default-branch ref, not a release tag.
  push:
    branches:
      - master
      - main
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-on-release.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-on-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read # Native media dependencies on GitHub Packages

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24.14.0
          cache: true
          install: false

      - name: Install docs dependencies
        run: node scripts/install-dependencies.mjs --filter sweetspot-docs...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch repo stars
        id: stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count="$(gh api "repos/${{ github.repository }}" --jq '.stargazers_count')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # Build fetches GitHub releases (stable + prerelease beta/alpha) via GITHUB_TOKEN
      - name: Build static site
        working-directory: apps/docs
        run: pnpm run build:pages
        env:
          GITHUB_PAGES: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_URL: https://sweetspot.bkk.ooo
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_TITLE: Sweet Spot
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_STARS: ${{ steps.stars.outputs.count }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out
          # build-pages.mjs writes out/.nojekyll (hidden); v5 excludes dotfiles by default
          include-hidden-files: true

      - name: Upload validated static site
        if: github.event_name == 'pull_request' || vars.DEPLOY_GITHUB_PAGES != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-static
          path: apps/docs/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
