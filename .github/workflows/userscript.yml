name: Build userscript

on:
  push:
    branches:
      - master
      - main
    paths:
      - "packages/userscript/**"
      - ".github/workflows/userscript.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read # Native media dependencies on GitHub Packages

concurrency:
  group: userscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build userscript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install userscript dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/install-dependencies.mjs --filter sweetspot-userscript...

      - name: Build userscript
        run: pnpm --filter sweetspot-userscript build

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v7
        with:
          name: sweetspot-userscript.user.js
          path: packages/userscript/dist/sweetspot-userscript.user.js
          if-no-files-found: error
          retention-days: 30
